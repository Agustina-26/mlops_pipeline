name: Validación del proyecto
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validar notebooks
        run: python scripts/validate_notebooks.py
      - name: Construir API
        run: docker build -t mlops-api .
      - name: Probar API en Docker
        run: |
          docker run -d --name api -p 8000:8000 mlops-api
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
